name: ducklake

services:
  # ----------------------------------------------------------------------
  # DuckLake catalog (metadata) — Postgres
  # ----------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: ducklake-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ducklake_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Host 5433 -> container 5432 (host 5432 is often already taken by a local Postgres).
      - "5433:5432"
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ducklake_catalog}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ----------------------------------------------------------------------
  # DuckLake data storage — RustFS (S3-compatible object store)
  #   S3 API : http://localhost:9000
  #   Console: http://localhost:9001   (login rustfsadmin / rustfsadmin)
  # ----------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ducklake-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./rustfs-data:/data
    command: ["/data"]
    restart: unless-stopped

  # ----------------------------------------------------------------------
  # One-shot: create the S3 bucket that holds the DuckLake Parquet data
  # ----------------------------------------------------------------------
  createbucket:
    # minio/mc is no longer pullable from Docker Hub; the AWS CLI speaks the same S3 API.
    image: amazon/aws-cli:latest
    container_name: ducklake-createbucket
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        aws --endpoint-url http://rustfs:9000 s3 ls > /dev/null 2>&1 && break;
        echo 'waiting for rustfs...'; sleep 2;
      done &&
      (aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket ${S3_BUCKET:-ducklake} 2> /dev/null ||
       aws --endpoint-url http://rustfs:9000 s3 mb s3://${S3_BUCKET:-ducklake}) &&
      echo '--- buckets ---' && aws --endpoint-url http://rustfs:9000 s3 ls
      "
    restart: "no"

  # ----------------------------------------------------------------------
  # One-shot: create + populate the demo DuckLake catalogs (several on one
  # Postgres server), BEFORE any DBeaver connection so tables exist on first browse.
  # ----------------------------------------------------------------------
  seed:
    image: python:3.12-slim
    container_name: ducklake-seed
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    volumes:
      - ./sql:/sql:ro
    command:
      - /bin/sh
      - -c
      - "pip install --no-cache-dir duckdb==${DUCKDB_VERSION:-1.5.4} 'psycopg[binary]' && python /sql/seed.py"
    restart: "no"
